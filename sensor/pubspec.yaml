name: leerie_sensor
description: >-
  Leerie scanner. A phone carried on a night walk measures exposure-corrected
  light through the camera, tags it with GPS, and writes it to Supabase.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera frame stream the luminance is measured from.
  camera: ^0.12.0
  # Camera2 backend: unlike the default CameraX one, it reports exposure time, ISO and aperture per frame.
  camera_android: ^0.10.10
  # Position, speed and GPS accuracy for every light reading.
  geolocator: ^13.0.1
  # PostgREST is plain HTTP; no Supabase SDK needed for this app.
  http: ^1.2.2
  # Random session id per walk.
  uuid: ^4.5.1
  # Settings that must survive a restart mid-demo.
  shared_preferences: ^2.3.2
  # The phone must not sleep while it is recording.
  wakelock_plus: ^1.2.8
  # Opens the public map from the wordmark.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Inter, per docs/design/DESIGN.md §0 (the mockup's override of the Industry base).
  # Bundled rather than fetched so the app types correctly with no signal.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
